global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Scrapes Express directly over the private compose network, bypassing nginx.
  # If METRICS_TOKEN is set for the backend, add:  authorization: { type: Bearer, credentials: <token> }
  - job_name: movie-booking-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3000"]
