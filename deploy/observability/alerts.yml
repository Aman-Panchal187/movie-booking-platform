# Prometheus alerting rules. They are evaluated and shown in the Prometheus UI (Alerts tab).
# No Alertmanager is configured, so nothing is sent to email/Slack until you add one.
groups:
  - name: movie-booking-api
    rules:
      - alert: ApiDown
        expr: up{job="movie-booking-api"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "API target is not being scraped" }

      - alert: High5xxRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "More than 5% of requests are failing with 5xx" }

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1.5
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "p95 latency above 1.5s" }

      - alert: PostgresConnectivityFailing
        expr: increase(postgres_connectivity_failures_total[5m]) > 0
        labels: { severity: critical }
        annotations: { summary: "Readiness checks cannot reach PostgreSQL" }

      - alert: CacheErrors
        expr: increase(cache_events_total{result="error"}[10m]) > 10
        labels: { severity: warning }
        annotations: { summary: "Redis errors; the API is serving from PostgreSQL" }

      - alert: PaymentFailureSpike
        expr: sum(increase(mock_payments_total{outcome="failed"}[15m])) > 20
        labels: { severity: warning }
        annotations: { summary: "Unusual number of failed mock payments" }

      - alert: SeatConflictSpike
        expr: increase(booking_conflicts_total[5m]) > 100
        labels: { severity: info }
        annotations: { summary: "Many seat-hold conflicts (popular show or abuse)" }

      - alert: RateLimitingActive
        expr: sum(increase(http_requests_total{status="429"}[5m])) > 50
        labels: { severity: info }
        annotations: { summary: "Many requests are being rate limited" }
