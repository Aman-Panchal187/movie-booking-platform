name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mbp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mbp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Lint
        run: npm run lint -w backend
      - name: Type check
        run: npm run typecheck -w backend
      - name: Unit, API, security, approval, report, cache and PostgreSQL concurrency tests
        run: npm run test -w backend
      - name: Validate OpenAPI document
        run: npm run openapi:validate -w backend
      - name: Build
        run: npm run build -w backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint -w frontend
      - run: npm run typecheck -w frontend
      - run: npm run test -w frontend
      - run: npm run build -w frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mbp_e2e
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-traces, path: test-results }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Express image
        uses: docker/build-push-action@v6
        with: { context: ., file: backend/Dockerfile, target: api, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Build Nginx + Express production image
        uses: docker/build-push-action@v6
        with: { context: ., file: backend/Dockerfile, target: edge, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
