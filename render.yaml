# Render Blueprint: one free Docker web service (Nginx + Express). Secrets are set in the dashboard (sync: false).
services:
  - type: web
    name: movie-booking-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerTarget: edge
    healthCheckPath: /nginx-health
    autoDeploy: true
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: RUN_MIGRATIONS, value: "true" }
      - { key: TRUST_PROXY, value: "1" }
      - { key: DB_POOL_MAX, value: "5" }
      - { key: LOG_LEVEL, value: info }
      - { key: DATABASE_URL, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: FRONTEND_URL, sync: false }
      - { key: CORS_ALLOWED_ORIGINS, sync: false }
      - { key: UPSTASH_REDIS_REST_URL, sync: false }
      - { key: UPSTASH_REDIS_REST_TOKEN, sync: false }
      - { key: CLOUDINARY_CLOUD_NAME, sync: false }
      - { key: CLOUDINARY_API_KEY, sync: false }
      - { key: CLOUDINARY_API_SECRET, sync: false }
      - { key: METRICS_TOKEN, generateValue: true }
